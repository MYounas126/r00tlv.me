# ---------------------------------------------------------------
# Hugo + PaperMod configuration
# Ported from Blog/_config.yml (Chirpy) in the Obsidian vault.
# ---------------------------------------------------------------

baseURL      = "https://r00tlv.me/"
locale       = "en-us"
title        = "r00tlv"
theme        = "PaperMod"

# Build-time date handling only. Post dates carry +05:00 explicitly.
timeZone = "Asia/Karachi"

enableRobotsTXT       = true
enableInlineShortcodes = true
enableEmoji           = false
buildDrafts           = false
buildFuture           = false
buildExpired          = false
pygmentsUseClasses    = true

summaryLength = 30

[pagination]
  pagerSize = 10

# RSS at /rss.xml rather than Hugo's default /index.xml
[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName  = "rss"

# JSON output on the home page feeds the Fuse.js client-side search index
[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag      = "tags"

# ------------------------------ menu ------------------------------
[menu]
  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "/posts/"
    weight     = 10
  [[menu.main]]
    identifier = "categories"
    name       = "Categories"
    url        = "/categories/"
    weight     = 20
  [[menu.main]]
    identifier = "tags"
    name       = "Tags"
    url        = "/tags/"
    weight     = 30
  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 50

# ----------------------------- params -----------------------------
[params]
  env         = "production"
  mainSections = ["posts"]
  avatar      = "/img/avatar.png"
  handle      = "@r00tlv"
  author      = "r00tlv"
  realName    = "Muhammad Younas"   # About page + post sidebar only
  hideAuthor  = true                # post byline shows the date only
  description = "Writeups on web, mobile and container security. Occasional reverse engineering and pwn.college notes."
  keywords    = ["security", "appsec", "web security", "mobile security", "container security", "reverse engineering", "hackthebox"]

  # Dark by default, toggle available, choice persisted in localStorage
  defaultTheme       = "dark"
  disableThemeToggle = false

  # Reading affordances the posts actually need
  ShowToc              = true
  TocOpen              = false
  ShowCodeCopyButtons  = true
  ShowPostNavLinks     = true
  ShowBreadCrumbs      = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true

  # Deliberately off: magazine furniture, per the design constraints
  ShowReadingTime  = false
  ShowWordCount    = false
  ShowShareButtons = false
  comments         = false
  hidemeta         = false
  showtoc          = true
  disableScrollToTop = false
  disableSpecial1stPost = true

  # cover images are list thumbnails only - no hero image on the post itself
  [params.cover]
    hiddenInSingle = true
    hiddenInList   = false

  [params.label]
    text = "r00tlv"

  [params.homeInfoParams]
    Title   = ""
    Content = ""

  [[params.socialIcons]]
    name = "github"
    title = "GitHub"
    url  = "https://github.com/MYounas126"
  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url  = "https://www.linkedin.com/in/myounasec/"
  [[params.socialIcons]]
    name = "medium"
    url  = "https://thehackboy.medium.com/"
  [[params.socialIcons]]
    name = "hackthebox"
    title = "HackTheBox"
    url  = "https://app.hackthebox.com/"
  [[params.socialIcons]]
    name = "email"
    url  = "mailto:muhammadyounas.sec@gmail.com"
  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url  = "/rss.xml"

  [params.fuseOpts]
    isCaseSensitive       = false
    shouldSort            = true
    location              = 0
    distance              = 1000
    threshold             = 0.4
    minMatchCharLength    = 0
    keys                  = ["title", "permalink", "summary", "content"]

# ---------------------------- markup ------------------------------
[markup]
  [markup.highlight]
    noClasses   = false      # emit CSS classes so PaperMod's chroma theme applies
    codeFences  = true
    guessSyntax = true
    lineNos     = false      # off: line-number tables break copy-paste and mobile width
    tabWidth    = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false
