<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="A value travelling from memory into a register and back again, showing load and store">
<style>
  .bg{fill:#12161f}
  .panel{fill:#1a2030;stroke:#2c3648;stroke-width:1.5;rx:10}
  .cell{fill:#151b28;stroke:#39465c;stroke-width:1.2;rx:5}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .lbl{fill:#8b98ad;font-size:12px;letter-spacing:1.2px}
  .addr{fill:#7c8aa0;font-size:13px}
  .mv{fill:#e6edf3;font-size:15px}
  .rn{fill:#b48ead;font-size:15px;font-weight:700}
  .val{fill:#56d4dd;font-size:26px;font-weight:700}
  .ins{fill:#f2b544;font-size:16px;font-weight:700}
  .cap{fill:#62d38a;font-size:13.5px}

  .pkt{animation:fly 10s ease-in-out infinite}
  @keyframes fly{
    0%,6%   {transform:translateX(0);opacity:0}
    10%     {opacity:1}
    36%     {transform:translateX(300px);opacity:1}
    40%,100%{transform:translateX(300px);opacity:0}
  }
  .pkt2{animation:fly2 10s ease-in-out infinite}
  @keyframes fly2{
    0%,56%  {transform:translateX(300px);opacity:0}
    60%     {transform:translateX(300px);opacity:1}
    86%     {transform:translateX(0);opacity:1}
    90%,100%{transform:translateX(0);opacity:0}
  }
  .v{opacity:0;animation:v 10s steps(1,end) infinite}
  .a{animation-delay:0s}   /* first half  */
  .b{animation-delay:5s}   /* second half */
  @keyframes v{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  .eaxLoaded{opacity:0;animation:el 10s steps(1,end) infinite}
  @keyframes el{0%,37%{opacity:0}38%,100%{opacity:1}}
  .eaxEmpty{animation:ee 10s steps(1,end) infinite}
  @keyframes ee{0%,37%{opacity:1}38%,100%{opacity:0}}
  .destFilled{opacity:0;animation:df 10s steps(1,end) infinite}
  @keyframes df{0%,87%{opacity:0}88%,100%{opacity:1}}
  .destEmpty{animation:de 10s steps(1,end) infinite}
  @keyframes de{0%,87%{opacity:1}88%,100%{opacity:0}}
</style>

<rect class="bg" width="820" height="400"/>
<text class="ttl" x="40" y="38">What does not fit in registers lives in memory</text>
<text class="sub" x="40" y="59">The brackets mean exactly what they mean in Python: memory[address]. That is the whole notation.</text>

<text class="ins v a" x="40" y="94">mov  eax, [0x4005db]     ← LOAD: memory into register</text>
<text class="ins v b" x="40" y="94">mov  [0x4005e3], eax     ← STORE: register into memory</text>

<rect class="panel" x="40" y="112" width="270" height="212"/>
<text class="lbl" x="58" y="138">MEMORY</text>

<rect class="cell" x="58" y="150" width="234" height="34"/>
<text class="addr" x="70" y="172">0x4005d3</text><text class="mv" x="230" y="172">17</text>

<rect class="cell" x="58" y="192" width="234" height="34"/>
<text class="addr" x="70" y="214">0x4005db</text><text class="mv" x="230" y="214">42</text>

<rect class="cell" x="58" y="234" width="234" height="34"/>
<text class="addr" x="70" y="256">0x4005e3</text>
<text class="mv destEmpty" x="230" y="256">0</text>
<text class="mv destFilled" x="230" y="256" fill="#62d38a">42</text>

<rect class="cell" x="58" y="276" width="234" height="34"/>
<text class="addr" x="70" y="298">0x4005eb</text><text class="mv" x="230" y="298">9</text>

<rect class="panel" x="600" y="150" width="180" height="118"/>
<text class="rn" x="620" y="180">EAX</text>
<text class="val eaxEmpty" x="620" y="228">0</text>
<text class="val eaxLoaded" x="620" y="228">42</text>
<text class="lbl" x="620" y="252">a register</text>

<g class="pkt"><g transform="translate(316,196)">
  <rect width="60" height="30" rx="15" fill="#56d4dd" opacity=".25" stroke="#56d4dd" stroke-width="1.5"/>
  <text x="20" y="21" fill="#9fe9ef" font-size="15" font-family="ui-monospace,Menlo,monospace" font-weight="700">42</text>
</g></g>
<g class="pkt2"><g transform="translate(316,238)">
  <rect width="60" height="30" rx="15" fill="#62d38a" opacity=".25" stroke="#62d38a" stroke-width="1.5"/>
  <text x="20" y="21" fill="#9be9b8" font-size="15" font-family="ui-monospace,Menlo,monospace" font-weight="700">42</text>
</g></g>

<text class="cap" x="40" y="356">Registers are where work happens. Memory is where things are kept. Every program is a</text>
<text class="cap" x="40" y="378">conversation between the two: pull it in, change it, put it back.</text>
</svg>
