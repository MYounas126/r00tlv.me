<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="The fetch decode execute cycle with a highlight travelling between the four stages">
<style>
  .bg{fill:#12161f}
  .box{fill:#1a2030;stroke:#2c3648;stroke-width:1.5;rx:10}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .st{fill:#e6edf3;font-size:15px;font-weight:700}
  .sd{fill:#8b98ad;font-size:12px}
  .num{fill:#56d4dd;font-size:13px;font-weight:700}
  .cap{fill:#62d38a;font-size:13.5px}

  #glow{animation:hop 8s steps(1,end) infinite}
  @keyframes hop{
    0%,24.9%  {transform:translateX(0px)}
    25%,49.9% {transform:translateX(186px)}
    50%,74.9% {transform:translateX(372px)}
    75%,100%  {transform:translateX(558px)}
  }
  .loop{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-16}}
</style>

<rect class="bg" width="820" height="340"/>
<text class="ttl" x="40" y="38">The entire job of a CPU, on repeat</text>
<text class="sub" x="40" y="59">There is no fifth step. Everything a computer has ever done is this loop, run fast enough.</text>

<g id="glow"><rect x="36" y="86" width="176" height="104" rx="12" fill="#f2b544" opacity="0.18"/></g>

<rect class="box" x="40" y="90" width="168" height="96"/>
<text class="num" x="58" y="116">STEP 1</text>
<text class="st"  x="58" y="140">FETCH</text>
<text class="sd"  x="58" y="164">read the bytes at RIP</text>

<rect class="box" x="226" y="90" width="168" height="96"/>
<text class="num" x="244" y="116">STEP 2</text>
<text class="st"  x="244" y="140">DECODE</text>
<text class="sd"  x="244" y="164">what do those bytes</text>
<text class="sd"  x="244" y="180">mean?</text>

<rect class="box" x="412" y="90" width="168" height="96"/>
<text class="num" x="430" y="116">STEP 3</text>
<text class="st"  x="430" y="140">EXECUTE</text>
<text class="sd"  x="430" y="164">do it, update flags</text>

<rect class="box" x="598" y="90" width="182" height="96"/>
<text class="num" x="616" y="116">STEP 4</text>
<text class="st"  x="616" y="140">ADVANCE RIP</text>
<text class="sd"  x="616" y="164">move to the next</text>
<text class="sd"  x="616" y="180">instruction</text>

<path d="M208 138 L226 138" stroke="#56d4dd" stroke-width="2" marker-end="url(#a)"/>
<path d="M394 138 L412 138" stroke="#56d4dd" stroke-width="2" marker-end="url(#a)"/>
<path d="M580 138 L598 138" stroke="#56d4dd" stroke-width="2" marker-end="url(#a)"/>
<path class="loop" d="M689 186 L689 232 L124 232 L124 186" fill="none" stroke="#f2b544" stroke-width="2" marker-end="url(#b)"/>

<defs>
  <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#56d4dd"/></marker>
  <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2b544"/></marker>
</defs>

<text class="cap" x="40" y="278">A jump, a branch and a call are all the same trick: they change what STEP 4 writes into RIP.</text>
<text class="cap" x="40" y="302">Nothing else in the loop is different. That is the whole of control flow.</text>
</svg>
