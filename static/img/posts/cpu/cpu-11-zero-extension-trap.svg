<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Writing to eax wipes the upper 32 bits of rax to zero while writing to al leaves them untouched">
<style>
  .bg{fill:#12161f}
  .panel{fill:#1a2030;stroke:#2c3648;stroke-width:1.5;rx:10}
  .cell{fill:#151b28;stroke:#39465c;stroke-width:1.2;rx:4}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .lbl{fill:#8b98ad;font-size:12px;letter-spacing:1.2px}
  .b{fill:#e6edf3;font-size:15px;font-weight:700}
  .wiped{fill:#ff6b6b;font-size:15px;font-weight:700}
  .kept{fill:#62d38a;font-size:15px;font-weight:700}
  .ins{fill:#f2b544;font-size:16px;font-weight:700}
  .bad{fill:#ff6b6b;font-size:13.5px;font-weight:700}
  .good{fill:#62d38a;font-size:13.5px;font-weight:700}
  .cap{fill:#62d38a;font-size:13.5px}

  .before{animation:bf 8s steps(1,end) infinite}
  @keyframes bf{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  .after{opacity:0;animation:af 8s steps(1,end) infinite}
  @keyframes af{0%,49.9%{opacity:0}50%,100%{opacity:1}}
</style>

<rect class="bg" width="820" height="420"/>
<text class="ttl" x="40" y="36">The trap that catches everyone exactly once</text>
<text class="sub" x="40" y="57">Start with rax = 0xFFFFFFFFFFFFFFFF in both cases. Same value, two instructions, very different results.</text>

<rect class="panel" x="40" y="80" width="740" height="126"/>
<text class="ins" x="60" y="108">mov eax, 1</text>
<text class="lbl" x="200" y="108">32-BIT WRITE</text>
<text class="bad after" x="330" y="108">upper 32 bits ZEROED, not preserved</text>

<g>
  <rect class="cell" x="60"  y="126" width="86" height="48"/>
  <text class="b before" x="82" y="157">FF</text><text class="wiped after" x="82" y="157">00</text>
  <rect class="cell" x="152" y="126" width="86" height="48"/>
  <text class="b before" x="174" y="157">FF</text><text class="wiped after" x="174" y="157">00</text>
  <rect class="cell" x="244" y="126" width="86" height="48"/>
  <text class="b before" x="266" y="157">FF</text><text class="wiped after" x="266" y="157">00</text>
  <rect class="cell" x="336" y="126" width="86" height="48"/>
  <text class="b before" x="358" y="157">FF</text><text class="wiped after" x="358" y="157">00</text>
  <rect class="cell" x="428" y="126" width="86" height="48" style="stroke:#f2b544"/>
  <text class="b before" x="450" y="157">FF</text><text class="b after" x="450" y="157">00</text>
  <rect class="cell" x="520" y="126" width="86" height="48" style="stroke:#f2b544"/>
  <text class="b before" x="542" y="157">FF</text><text class="b after" x="542" y="157">00</text>
  <rect class="cell" x="612" y="126" width="86" height="48" style="stroke:#f2b544"/>
  <text class="b before" x="634" y="157">FF</text><text class="b after" x="634" y="157">00</text>
  <rect class="cell" x="704" y="126" width="86" height="48" style="stroke:#f2b544"/>
  <text class="b before" x="726" y="157">FF</text><text class="b after" x="726" y="157">01</text>
</g>
<text class="sub" x="60" y="194">rax is now 0x0000000000000001</text>

<rect class="panel" x="40" y="224" width="740" height="126"/>
<text class="ins" x="60" y="252">mov al, 1</text>
<text class="lbl" x="200" y="252">8-BIT WRITE</text>
<text class="good after" x="330" y="252">everything above is left alone</text>

<g>
  <rect class="cell" x="60"  y="270" width="86" height="48"/><text class="b" x="82"  y="301">FF</text>
  <rect class="cell" x="152" y="270" width="86" height="48"/><text class="b" x="174" y="301">FF</text>
  <rect class="cell" x="244" y="270" width="86" height="48"/><text class="b" x="266" y="301">FF</text>
  <rect class="cell" x="336" y="270" width="86" height="48"/><text class="b" x="358" y="301">FF</text>
  <rect class="cell" x="428" y="270" width="86" height="48"/><text class="b" x="450" y="301">FF</text>
  <rect class="cell" x="520" y="270" width="86" height="48"/><text class="b" x="542" y="301">FF</text>
  <rect class="cell" x="612" y="270" width="86" height="48"/><text class="b" x="634" y="301">FF</text>
  <rect class="cell" x="704" y="270" width="86" height="48" style="stroke:#62d38a"/>
  <text class="b before" x="726" y="301">FF</text><text class="kept after" x="726" y="301">01</text>
</g>
<text class="sub" x="60" y="338">rax is now 0xFFFFFFFFFFFFFF01</text>

<text class="cap" x="40" y="382">Only the 32-bit write zero-extends. 8-bit and 16-bit writes do not.</text>
<text class="cap" x="40" y="406">When a register "mysteriously" changed while reading disassembly, this is almost always why.</text>
</svg>
