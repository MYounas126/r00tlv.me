<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="The bytes B8 05 00 00 00 being decoded into the instruction mov eax 5, showing opcode and little endian operand">
<style>
  .bg{fill:#12161f}
  .panel{fill:#1a2030;stroke:#2c3648;stroke-width:1.5;rx:10}
  .byte{fill:#151b28;stroke:#39465c;stroke-width:1.5;rx:6}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .lbl{fill:#8b98ad;font-size:12px;letter-spacing:1.2px}
  .hex{fill:#e6edf3;font-size:22px;font-weight:700}
  .op{fill:#f2b544;font-size:22px;font-weight:700}
  .num{fill:#56d4dd;font-size:22px;font-weight:700}
  .asm{fill:#62d38a;font-size:24px;font-weight:700}
  .note{fill:#8b98ad;font-size:13px}
  .cap{fill:#62d38a;font-size:13.5px}

  .v{opacity:0;animation:v 12s steps(1,end) infinite}
  .s0{animation-delay:0s} .s1{animation-delay:3s} .s2{animation-delay:6s} .s3{animation-delay:9s}
  @keyframes v{0%,24.9%{opacity:1}25%,100%{opacity:0}}
  .after1{opacity:0;animation:a1 12s steps(1,end) infinite}
  @keyframes a1{0%,24.9%{opacity:0}25%,100%{opacity:1}}
  .after2{opacity:0;animation:a2 12s steps(1,end) infinite}
  @keyframes a2{0%,49.9%{opacity:0}50%,100%{opacity:1}}
  .after3{opacity:0;animation:a3 12s steps(1,end) infinite}
  @keyframes a3{0%,74.9%{opacity:0}75%,100%{opacity:1}}
</style>

<rect class="bg" width="820" height="430"/>
<text class="ttl" x="40" y="36">Assembly is not what the CPU reads. Numbers are.</text>
<text class="sub" x="40" y="57">"mov eax, 5" is something a disassembler invented so that you could read it.</text>

<text class="lbl" x="40" y="94">WHAT IS ACTUALLY IN MEMORY AT 0x4005d0</text>

<rect class="byte after1" x="40"  y="108" width="70" height="58" style="stroke:#f2b544"/>
<rect class="byte" x="40"  y="108" width="70" height="58"/>
<text class="hex v s0"  x="58" y="146">B8</text>
<text class="op after1" x="58" y="146">B8</text>

<rect class="byte after2" x="122" y="108" width="70" height="58" style="stroke:#56d4dd"/>
<rect class="byte" x="122" y="108" width="70" height="58"/>
<text class="hex v s0" x="140" y="146">05</text><text class="hex v s1" x="140" y="146">05</text>
<text class="num after2" x="140" y="146">05</text>

<rect class="byte after2" x="204" y="108" width="70" height="58" style="stroke:#56d4dd"/>
<rect class="byte" x="204" y="108" width="70" height="58"/>
<text class="hex v s0" x="222" y="146">00</text><text class="hex v s1" x="222" y="146">00</text>
<text class="num after2" x="222" y="146">00</text>

<rect class="byte after2" x="286" y="108" width="70" height="58" style="stroke:#56d4dd"/>
<rect class="byte" x="286" y="108" width="70" height="58"/>
<text class="hex v s0" x="304" y="146">00</text><text class="hex v s1" x="304" y="146">00</text>
<text class="num after2" x="304" y="146">00</text>

<rect class="byte after2" x="368" y="108" width="70" height="58" style="stroke:#56d4dd"/>
<rect class="byte" x="368" y="108" width="70" height="58"/>
<text class="hex v s0" x="386" y="146">00</text><text class="hex v s1" x="386" y="146">00</text>
<text class="num after2" x="386" y="146">00</text>

<g class="after1">
  <path d="M75 174 L75 194" stroke="#f2b544" stroke-width="2"/>
  <text class="op" x="40" y="216" font-size="14">OPCODE</text>
  <text class="note" x="40" y="236">"put the next 4 bytes</text>
  <text class="note" x="40" y="254">into EAX"</text>
</g>

<g class="after2">
  <path d="M157 174 L157 194 L403 194 L403 174" fill="none" stroke="#56d4dd" stroke-width="2"/>
  <text class="num" x="200" y="216" font-size="14">OPERAND · 4 bytes, little-endian</text>
  <text class="note" x="200" y="236">read the bytes backwards:  00 00 00 05  =  0x00000005  =  5</text>
  <text class="note" x="200" y="254">the smallest byte is stored first. This trips up everyone, once.</text>
</g>

<g class="after3">
  <rect class="panel" x="40" y="278" width="740" height="76"/>
  <text class="lbl" x="60" y="304">WHAT THE DISASSEMBLER SHOWS YOU</text>
  <text class="asm" x="60" y="338">mov  eax, 5</text>
  <text class="note" x="300" y="338">← same five bytes, translated for humans</text>
</g>

<text class="cap" x="40" y="392">A disassembler is a translator, not a source of truth. Change one byte and the "instruction"</text>
<text class="cap" x="40" y="414">changes. Start reading at a different offset and you get a completely different program.</text>
</svg>
