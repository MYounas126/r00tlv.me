<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="One 64-bit register with rax, eax, ax, ah and al highlighted in turn as windows onto the same storage">
<style>
  .bg{fill:#12161f}
  .panel{fill:#1a2030;stroke:#2c3648;stroke-width:1.5;rx:10}
  .cell{fill:#151b28;stroke:#39465c;stroke-width:1.2;rx:4}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .lbl{fill:#8b98ad;font-size:12px;letter-spacing:1.2px}
  .byte{fill:#e6edf3;font-size:17px;font-weight:700}
  .bit{fill:#5b6779;font-size:10.5px}
  .nm{fill:#f2b544;font-size:28px;font-weight:700}
  .val{fill:#56d4dd;font-size:22px;font-weight:700}
  .cap{fill:#62d38a;font-size:13.5px}

  .v{opacity:0;animation:v 15s steps(1,end) infinite}
  .s0{animation-delay:0s}   .s1{animation-delay:3s} .s2{animation-delay:6s}
  .s3{animation-delay:9s}   .s4{animation-delay:12s}
  @keyframes v{0%,19.9%{opacity:1}20%,100%{opacity:0}}
  .hl{fill:#f2b544;fill-opacity:.20;rx:6}
</style>

<rect class="bg" width="820" height="400"/>
<text class="ttl" x="40" y="36">rax, eax, ax, al are ONE register, not four</text>
<text class="sub" x="40" y="57">They are windows onto the same 8 bytes. Change the small one and you changed the big one.</text>

<text class="lbl" x="40" y="96">ONE 64-BIT REGISTER, HOLDING 0x1122334455667788</text>

<g>
  <rect class="cell" x="40"  y="110" width="90" height="56"/><text class="byte" x="64"  y="146">11</text>
  <rect class="cell" x="136" y="110" width="90" height="56"/><text class="byte" x="160" y="146">22</text>
  <rect class="cell" x="232" y="110" width="90" height="56"/><text class="byte" x="256" y="146">33</text>
  <rect class="cell" x="328" y="110" width="90" height="56"/><text class="byte" x="352" y="146">44</text>
  <rect class="cell" x="424" y="110" width="90" height="56"/><text class="byte" x="448" y="146">55</text>
  <rect class="cell" x="520" y="110" width="90" height="56"/><text class="byte" x="544" y="146">66</text>
  <rect class="cell" x="616" y="110" width="90" height="56"/><text class="byte" x="640" y="146">77</text>
  <rect class="cell" x="712" y="110" width="90" height="56"/><text class="byte" x="736" y="146">88</text>
</g>
<text class="bit" x="40"  y="182">bit 63  (most significant)</text>
<text class="bit" x="628" y="182">bit 0  (least significant)</text>

<rect class="hl v s0" x="36"  y="106" width="770" height="64"/>
<rect class="hl v s1" x="420" y="106" width="386" height="64"/>
<rect class="hl v s2" x="612" y="106" width="194" height="64"/>
<rect class="hl v s3" x="612" y="106" width="98"  height="64"/>
<rect class="hl v s4" x="708" y="106" width="98"  height="64"/>

<rect class="panel" x="40" y="204" width="766" height="96"/>
<text class="nm v s0" x="64" y="248">rax</text><text class="nm v s1" x="64" y="248">eax</text>
<text class="nm v s2" x="64" y="248">ax</text> <text class="nm v s3" x="64" y="248">ah</text>
<text class="nm v s4" x="64" y="248">al</text>

<text class="sub v s0" x="64" y="276">all 64 bits · 8 bytes</text>
<text class="sub v s1" x="64" y="276">lower 32 bits · 4 bytes</text>
<text class="sub v s2" x="64" y="276">lower 16 bits · 2 bytes</text>
<text class="sub v s3" x="64" y="276">bits 8 to 15 · the odd one</text>
<text class="sub v s4" x="64" y="276">lowest 8 bits · 1 byte</text>

<text class="val v s0" x="250" y="252">0x1122334455667788</text>
<text class="val v s1" x="250" y="252">0x55667788</text>
<text class="val v s2" x="250" y="252">0x7788</text>
<text class="val v s3" x="250" y="252">0x77</text>
<text class="val v s4" x="250" y="252">0x88</text>

<text class="cap" x="40" y="336">Same idea for rbx/ebx/bx/bl, rcx/ecx/cx/cl, and r8/r8d/r8w/r8b.</text>
<text class="cap" x="40" y="360">"Lower" always means the least-significant end, which is the right-hand side above.</text>
<text class="sub" x="40" y="386">In a decompiler you will see eax and rax used for the same variable in the same function. Now you know why.</text>
</svg>
