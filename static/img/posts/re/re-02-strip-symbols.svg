<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Running strip on a binary removes the local symbol table while the dynamic symbols for imported functions remain">
<style>
  .bg{fill:#12161f}
  .panel{fill:#161b28;stroke:#2c3648;stroke-width:1.5;rx:10}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ttl{fill:#e6edf3;font-size:17px;font-weight:700}
  .sub{fill:#8b98ad;font-size:12.5px}
  .num{fill:#56d4dd;font-size:12px;font-weight:700}
  .cap{fill:#62d38a;font-size:13.5px}
  .sym{fill:#e6edf3;font-size:12.5px}
  .addr{fill:#8b98ad;font-size:12.5px}
  .gone{fill:#ed8796;font-size:13px;font-weight:700}
  .cmd{fill:#f2b544;font-size:13px;font-weight:700}

  /* 10s cycle: 0-45% unstripped, 50-100% stripped */
  .local{animation:vanish 10s steps(1,end) infinite}
  @keyframes vanish{0%,44.9%{opacity:1} 45%,100%{opacity:0}}

  .after{animation:appear 10s steps(1,end) infinite}
  @keyframes appear{0%,44.9%{opacity:0} 45%,100%{opacity:1}}

  .runcmd{animation:flash 10s steps(1,end) infinite}
  @keyframes flash{0%,39.9%{opacity:0.25} 40%,49.9%{opacity:1} 50%,100%{opacity:0.25}}

  .lbl-before{animation:lb 10s steps(1,end) infinite}
  @keyframes lb{0%,44.9%{fill:#62d38a} 45%,100%{fill:#4a5468}}
</style>

<rect class="bg" width="820" height="380"/>
<text class="ttl" x="40" y="38">strip removes .symtab, never .dynsym</text>
<text class="sub" x="40" y="59">The loader needs the imports, so they stay. Your own function names do not.</text>

<text class="cmd runcmd" x="40" y="92">$ strip ./target</text>

<rect class="panel" x="40" y="110" width="360" height="200"/>
<text class="num" x="60" y="136">.symtab</text>
<text class="sym lbl-before" x="140" y="136">your own functions</text>

<g class="local">
  <text class="addr" x="60" y="166">00401136</text><text class="sym" x="150" y="166">T  validate_licence</text>
  <text class="addr" x="60" y="190">004011a4</text><text class="sym" x="150" y="190">T  derive_key</text>
  <text class="addr" x="60" y="214">00401210</text><text class="sym" x="150" y="214">T  check_input</text>
  <text class="addr" x="60" y="238">00404060</text><text class="sym" x="150" y="238">B  attempts</text>
  <text class="addr" x="60" y="262">00401080</text><text class="sym" x="150" y="262">T  main</text>
</g>

<g class="after">
  <text class="gone" x="60" y="190">nm: ./target: no symbols</text>
  <text class="addr" x="60" y="226">every name you wanted</text>
  <text class="addr" x="60" y="250">is now FUN_00401136</text>
</g>

<rect class="panel" x="424" y="110" width="356" height="200"/>
<text class="num" x="444" y="136">.dynsym</text>
<text class="sym" x="524" y="136" fill="#62d38a">survives either way</text>

<text class="sym" x="524" y="166">U  strcmp</text>
<text class="sym" x="524" y="190">U  printf</text>
<text class="sym" x="524" y="214">U  open</text>
<text class="sym" x="524" y="238">U  ptrace</text>
<text class="sym" x="524" y="262">U  getenv</text>
<text x="444" y="290" fill="#8b98ad" font-size="11.5px" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">nm -D still lists all of these</text>

<text class="cap" x="40" y="342">That asymmetry is the foothold. You cannot see validate_licence, but you can see</text>
<text class="cap" x="40" y="364">every call to strcmp, and in a crackme that is usually where the answer lives.</text>
</svg>
